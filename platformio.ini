; Development/CI environments for the library itself. Consumers do not use this file.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags = -std=gnu++17
; Fails the run when a source file is not clang-formatted (needs: pip install clang-format).
extra_scripts = pre:scripts/check_format.py
; Only the pure protocol layer builds on the host; the eModbus driver needs the ESP32 core.
build_src_filter = +<Tuf2000Protocol.cpp>

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
lib_deps = https://github.com/eModbus/eModbus.git#v1.7.4.stable
; The library API is unused inside the library itself, so unusedFunction is meaningless here.
check_tool = cppcheck
check_skip_packages = yes
check_flags = cppcheck: --suppress=unusedFunction
