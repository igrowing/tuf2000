name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-native-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - run: pio test -e native

  build-example:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example: [basic, async, bus_scan, register_dump, diagnose, rs485_de_pin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-esp32-${{ hashFiles('platformio.ini', 'library.json') }}
      - run: pip install platformio
      - name: Build examples/${{ matrix.example }} for ESP32 (pioarduino)
        run: >
          pio ci examples/${{ matrix.example }} --lib=. --board=esp32dev
          --project-option="platform=https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip"
          --project-option="framework=arduino"
          --project-option="lib_deps=https://github.com/eModbus/eModbus.git#v1.7.4.stable"
